<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apps by Asım Can Yağız</title>
  <meta name="description" content="Independent iOS apps by Asım Can Yağız: privacy policies, terms of service, and support.">
  <meta name="theme-color" content="#0f1115">
  <link rel="canonical" href="https://asimcanyagiz.github.io/">
  <link rel="icon" href="assets/img/favicon.png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{ --bg:#0f1115; --card:#171a21; --line:#262b36; --ink:#f4f6fb; --muted:#a3adbf; --accent:#8b9cff; }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column}
    .wrap{max-width:880px;margin:0 auto;padding:72px 24px;flex:1;width:100%}
    h1{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:clamp(28px,5vw,40px);letter-spacing:-.02em}
    .sub{color:var(--muted);margin-top:12px;font-size:17px;line-height:1.6;max-width:56ch}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin-top:44px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;color:inherit}
    .card h2{font-size:18px;font-weight:700}
    .card p{color:var(--muted);font-size:14px;margin-top:4px}
    .links{margin-top:16px;display:flex;gap:14px;flex-wrap:wrap}
    .links a{color:var(--accent);font-size:14px;text-decoration:none}
    .links a:hover{text-decoration:underline}
    footer{border-top:1px solid var(--line);color:var(--muted);font-size:13px;text-align:center;padding:24px}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Apps by Asım Can Yağız</h1>
    <p class="sub">Independent iOS apps built with care. Choose an app below for its privacy policy, terms of service, and support.</p>

    <div class="grid">
      <div class="card">
        <h2>Workr</h2>
        <p>To-Do List &amp; Planner</p>
        <div class="links">
          <a href="workr-pages/privacy.html">Privacy</a>
          <a href="workr-pages/terms.html">Terms</a>
          <a href="workr-pages/support.html">Support</a>
        </div>
      </div>
      <div class="card">
        <h2>MoneyPot</h2>
        <p>AI Expense Manager</p>
        <div class="links">
          <a href="moneypot-legal/privacy-policy.html">Privacy</a>
          <a href="moneypot-legal/terms.html">Terms</a>
        </div>
      </div>
    </div>
  </div>

  <footer>
    <p>© 2026 Asım Can Yağız</p>
  </footer>
</body>
</html>
